name: java

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # unit tests (surefire), integration tests against PostgreSQL via Testcontainers (failsafe),
      # JaCoCo gate of 75% lines on bridge-core and bridge-sync
      - run: mvn -B verify
      - name: Integration tests must have run, not been skipped
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          tests = skipped = 0
          for f in glob.glob("*/target/failsafe-reports/TEST-*.xml"):
              r = ET.parse(f).getroot()
              tests += int(r.get("tests")); skipped += int(r.get("skipped"))
          print(f"integration tests: {tests}, skipped: {skipped}")
          assert tests > 0 and skipped == 0, "Testcontainers did not run the ITs"
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco
          path: "**/target/site/jacoco/"
