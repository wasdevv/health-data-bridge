server.port=${ERP_PORT:8090}
spring.application.name=erp-mock
spring.main.banner-mode=off
management.endpoints.web.exposure.include=health
spring.jackson.serialization.write-dates-as-timestamps=false
# seed customers, locations and one invoice for an encounter that does not exist (reconciliation demo)
erp.seed.enabled=${ERP_SEED_ENABLED:true}
erp.seed.planted-divergence=${ERP_SEED_PLANTED_DIVERGENCE:true}
# fixed seed so a fault scenario replays the same way
erp.faults.random-seed=${ERP_FAULTS_RANDOM_SEED:42}
# the mock keeps everything in memory; when it runs inside the bridge's test JVM, the JDBC and Flyway
# jars on the classpath must not make it look for a database
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
