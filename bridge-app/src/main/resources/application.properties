spring.application.name=health-data-bridge
spring.main.banner-mode=off
server.port=${PORT:8080}
spring.datasource.url=${HDB_DB_URL:jdbc:postgresql://localhost:5432/hdb}
spring.datasource.username=${HDB_DB_USER:hdb}
spring.datasource.password=${HDB_DB_PASSWORD:hdb}
spring.jackson.serialization.write-dates-as-timestamps=false

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true

bridge.sync.erp-base-url=${ERP_BASE_URL:http://localhost:8090}
bridge.sync.worker-enabled=${HDB_WORKER_ENABLED:true}
bridge.registry.enabled=${HDB_REGISTRY_ENABLED:true}
bridge.reconciliation.enabled=${HDB_RECONCILIATION_ENABLED:true}
# loads 20 fictitious patients and 50 finished encounters on an empty database
bridge.seed.enabled=${HDB_SEED_ENABLED:false}

logging.level.ca.uhn.fhir=WARN
