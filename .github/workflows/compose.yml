name: compose

# Brings the stack up the way a reader of the README would and walks the acceptance path:
# metadata, the seed invoiced once per encounter, an invalid resource rejected, the planted divergence
# found by reconciliation, an ERP outage that loses nothing, a DLQ event reprocessed, Prometheus metrics.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait --wait-timeout 600
      - name: Acceptance path
        run: python3 -I scripts/smoke.py http://localhost:8080 http://localhost:8090
      - name: No CPF-shaped value in the bridge logs
        run: |
          docker compose logs --no-color bridge > bridge.log
          # UUIDs contain digit runs; strip them before looking for 000.000.000-00 or 11 digits in a row
          if sed -E 's/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}//g' bridge.log \
               | grep -E '(^|[^0-9])([0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}|[0-9]{11})([^0-9]|$)'; then
            echo "CPF-shaped value found in the logs"; exit 1
          fi
      - if: failure()
        run: docker compose logs --no-color | tail -300
      - if: always()
        run: docker compose down -v
